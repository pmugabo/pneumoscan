<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PneumoScan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'><path d='M12 3v8M7.5 6C5 7 3 11 3 16c0 2.5 1.5 4 3.5 4S10 19 10 16v-5.5C10 8 9 6 7.5 6zM16.5 6C19 7 21 11 21 16c0 2.5-1.5 4-3.5 4S14 19 14 16v-5.5C14 8 15 6 16.5 6z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/assets/style.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/static/assets/core.js?v=2"></script>
</head>
<body>
<div id="boot" class="loading" style="min-height:100vh"><span class="spin" style="width:28px;height:28px"></span></div>
<div class="shell hidden" id="shell">
  <aside class="side" id="side">
    <a class="brand" href="#/"><span class="logo" id="logo"></span>PneumoScan</a>
    <div class="portal-tag" id="portalTag"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="me"><div class="avatar" id="meAvatar"></div>
        <div style="min-width:0;flex:1"><div class="n" id="meName"></div><div class="r" id="meRole"></div></div>
        <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out" style="width:34px;height:34px"></button>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"></button>
      <div><h1 id="pageTitle"></h1><div class="crumb" id="pageCrumb"></div></div>
      <span class="spacer"></span>
      <button class="icon-btn" id="themeBtn" title="Toggle light/dark mode" aria-label="Toggle theme"></button>
      <div style="position:relative">
        <button class="icon-btn" id="bellBtn" title="Notifications" aria-label="Notifications"></button>
        <div class="popover hidden" id="notifPop"></div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<script src="/static/assets/app.js?v=2"></script>
<script src="/static/assets/clinician.js?v=2"></script>
<script src="/static/assets/specialist.js?v=2"></script>
<script src="/static/assets/admin.js?v=2"></script>
<script>boot();</script>
</body>
</html>
